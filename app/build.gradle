plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.tpv.plus'

    compileSdk 34
    buildToolsVersion = '34.0.4'

    defaultConfig {
        applicationId "com.tpv.plus"
        minSdk 23
        targetSdkVersion 34
        versionCode 10
        versionName "1.0-beta"
        ndk.abiFilters 'armeabi-v7a', 'arm64-v8a'
    }

    signingConfigs {
        release {
            keyAlias 'app-release'
            keyPassword 'Aizenluis'
            storeFile file('aizen_sarmiento.jks')
            storePassword 'Aizenluis'
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'RestrictedApi'
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':logger')
    implementation project(':v2ray')
    implementation project(':vpncommons')
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.mcxiaoke.volley:library:1.0.19'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.0.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.7.0"
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'
    implementation 'com.google.firebase:firebase-analytics:21.2.0'
    implementation 'com.google.firebase:firebase-messaging:23.1.0'
    implementation 'com.google.android.play:core:1.10.3'
    implementation "com.airbnb.android:lottie:3.4.0"
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
}
